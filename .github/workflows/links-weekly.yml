# Weekly external link check. Opens (or comments on) an issue when links break.
name: Links (weekly)

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .github/lychee.toml --no-progress './**/*.md'
          output: lychee-report.md
          fail: false
      - name: Open or update issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Weekly link check found broken links"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file lychee-report.md
          else
            gh issue create --title "$title" --body-file lychee-report.md
          fi
